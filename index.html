<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>
    <main class="container">
        <section class="balance-container">
            <section class="total-balance">
                <p>Total Balance</p>
                <p class="balance">Rp.0</p>
            </section>
            <section class="incoming-balance">
                <p>Incoming Balance</p>
                <p class="in-balance">Rp.200.000</p>
            </section>
            <section class="outgoing-balance">
                <p>Outgoing Balance</p>
                <p class="out-balance">Rp.150.000</p>
            </section>
        </section>
        <section class="transactions-container">
            <nav class="transactions-nav">
                <select name="transaction-filter" id="transaction-filter">
                    <option value="All Transaction" selected>All Transaction</option>
                    <option value="Incoming Transaction">Incoming Transaction</option>
                    <option value="Outgoing Transaction">Outgoing Transaction</option>
                </select>
                <button type="button" class="add-transaction">+</button>
                <input type="text" placeholder="Search Transaction">
                <button type="button" class="search">S</button>
            </nav>
            <section class="list-transactions">

            </section>
        </section>
        <section class="new-transaction">
            <form action="">
                <label for="transaction-desc">Description : </label>
                <input type="text" name="transaction-desc" id="transaction-desc" placeholder="Description" required>
                <label for="total-money">Total Money : </label>
                <input type="number" name="total-money" id="total-money" placeholder="Total Money" required>
                <select name="transaction-type" id="transaction-type">
                    <option value="" disabled selected>Transaction Type</option>
                    <option value="Incoming">Incoming</option>
                    <option value="Outgoing">Outgoing</option>
                </select>
                <select name="incoming-type" id="incoming-type">
                    <option value="" disabled selected>Incoming Type</option>
                    <option value="Salary">Salary</option>
                    <option value="Bonus">Bonus</option>
                    <option value="Freelance">Freelance</option>
                    <option value="Other">Other</option>
                </select>
                <select name="outgoing-type" id="outgoing-type">
                    <option value="" disabled selected>Outgoing Type</option>
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bill">Bill</option>
                    <option value="Entertaiment">Entertaiment</option>
                    <option value="Healthy">Healthy</option>
                    <option value="Other">Other</option>
                </select>
                <button type="button" class="add-new-transaction">Add Transaction</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
